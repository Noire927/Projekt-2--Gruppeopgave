<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opret bruger - Klædt på</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
</head>

<body>
    <main class="screen screen--start">
        <a class="back-link" href="login.html">‹ Tilbage</a>
        <h1 class="title">Opret bruger</h1>
        <form class="form js-signup-form" id="signup-form" method="post" action="/api/register"
            data-next="profile.html">
            <div class="form__field">
                <label class="form__label" for="email">E-mail</label>
                <input class="form__input" id="email" name="email" type="email" autocomplete="email"
                    placeholder="navn@eksempel.dk" required>
            </div>
            <div class="form__field">
                <label class="form__label" for="password">Kodeord</label>
                <input class="form__input" id="password" name="password" type="password" autocomplete="new-password"
                    minlength="8" required>
            </div>
            <p id="auth-message" role="alert"></p>
            <button class="button" type="submit">Næste</button>
        </form>
        <a class="link" href="login-form.html">Har du allerede en bruger? Log ind</a>
    </main>
    <script src="js/authentication.js" defer></script>
</body>

</html>
