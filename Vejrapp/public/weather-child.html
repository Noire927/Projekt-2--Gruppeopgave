<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vejret - Klædt på</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/child.css">
</head>

<body>
    <main class="screen screen--child">
        <header class="header">
            <h1 class="header__title">Klædt på</h1>
        </header>
        <form class="search js-search-form" role="search">
            <label class="visually-hidden" for="city-input">Søg efter by</label>
            <input class="search__input" id="city-input" name="city" type="search" placeholder="Søg efter by"
                autocomplete="off">
            <button class="search__locate js-locate" id="locate-button" type="button"><span aria-hidden="true">📍</span>
                Find mig</button>
        </form>
        <p id="weather-message" role="status"></p>
        <section class="banner" aria-live="polite" aria-label="Vejret nu">
            <img class="banner__image" id="weather-image" src="images/child-weather-sunny.jpg"
                alt="Tegning af sol og regnbue" width="430" height="240">
            <p class="banner__pill">
                <strong id="city-name">Odense</strong>
                <span><span id="temperature">—</span> °C</span>
                <span id="condition">Solrig</span>
            </p>
        </section>
        <ul class="stats">
            <li class="stats__item">
                <span class="stats__label">Føles som</span>
                <span class="stats__value"><span id="feels-like">—</span> °C</span>
            </li>
            <li class="stats__item">
                <span class="stats__label">Vind</span>
                <span class="stats__value"><span id="wind">—</span> m/s</span>
            </li>
            <li class="stats__item">
                <span class="stats__label">Regn</span>
                <span class="stats__value"><span id="rain">—</span> mm</span>
            </li>
        </ul>
        <section class="outfit" aria-label="Dagens outfit">
            <h2 class="outfit__title">Dagens outfit</h2>
            <img class="outfit__image" id="outfit-image" src="images/child-outfit-sunny.png"
                alt="Tegnefilmsfigur med propelhat, t-shirt og shorts" width="260" height="347">
            <p class="outfit__text" id="advice-text">T-shirt og shorts. Husk solcreme!</p>
        </section>
        <section class="forecast" aria-label="Vejrudsigt">
            <input class="forecast__radio" type="radio" name="forecast-view" id="view-daily" checked>
            <input class="forecast__radio" type="radio" name="forecast-view" id="view-hourly">
            <div class="forecast__tabs">
                <label class="forecast__tab" for="view-daily">5-dages prognose</label>
                <label class="forecast__tab" for="view-hourly">Hver 3. time</label>
            </div>
            <p id="forecast-message" role="status"></p>
            <ul class="forecast__list forecast__list--daily" id="forecast-daily"></ul>
            <ul class="forecast__list forecast__list--hourly" id="forecast-hourly"></ul>
            <template id="forecast-row">
                <li class="forecast__item">
                    <span class="forecast__day"></span>
                    <span class="forecast__temp"><span class="forecast__value"></span> °C</span>
                    <img class="forecast__icon" width="40" height="40" alt="">
                </li>
            </template>
        </section>
    </main>
    <script src="js/weather.js" defer></script>
    <script src="js/recommendations.js" defer></script>
    <script src="js/location.js" defer></script>
</body>

</html>
