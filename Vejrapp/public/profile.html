<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Om dig - Klædt på</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
    <main class="screen screen--start">
        <a class="back-link" href="signup.html">‹ Tilbage</a>
        <h1 class="title">Velkommen <span class="js-user-name">[NAVN]</span> til Klædt på</h1>
        <form class="form profile js-profile-form" id="profile-form" method="post" action="/api/profile" data-next-adult="clothing-adult.html" data-next-child="clothing-child.html">
            <div class="form__field">
                <label class="form__label" for="age">Hvor gammel er du?</label>
                <input class="form__input js-age" id="age" name="age" type="number" inputmode="numeric" min="3" max="120" placeholder="Alder" required>
            </div>
            <fieldset class="choice">
                <legend class="choice__legend">Køn</legend>
                <div class="choice__options">
                    <input class="choice__input js-gender" type="radio" id="gender-male" name="gender" value="male" required>
                    <label class="choice__label" for="gender-male">Mand</label>
                    <input class="choice__input js-gender" type="radio" id="gender-female" name="gender" value="female">
                    <label class="choice__label" for="gender-female">Kvinde</label>
                    <input class="choice__input js-gender" type="radio" id="gender-other" name="gender" value="other">
                    <label class="choice__label" for="gender-other">Andet</label>
                </div>
            </fieldset>
            <fieldset class="profile__tags">
                <legend class="profile__tags-title">Vælg din stil (mindst 3):</legend>
                <div class="tags">
                    <input class="tags__input" type="checkbox" id="style-modern" name="style" value="modern">
                    <label class="tags__label" for="style-modern">Moderne</label>
                    <input class="tags__input" type="checkbox" id="style-hipster" name="style" value="hipster">
                    <label class="tags__label" for="style-hipster">Hipster</label>
                    <input class="tags__input" type="checkbox" id="style-oldschool" name="style" value="oldschool">
                    <label class="tags__label" for="style-oldschool">Old-school</label>
                    <input class="tags__input" type="checkbox" id="style-sporty" name="style" value="sporty">
                    <label class="tags__label" for="style-sporty">Sporty</label>
                    <input class="tags__input" type="checkbox" id="style-classic" name="style" value="classic">
                    <label class="tags__label" for="style-classic">Klassisk</label>
                    <input class="tags__input" type="checkbox" id="style-casual" name="style" value="casual">
                    <label class="tags__label" for="style-casual">Afslappet</label>
                    <input class="tags__input" type="checkbox" id="style-streetwear" name="style" value="streetwear">
                    <label class="tags__label" for="style-streetwear">Streetwear</label>
                    <input class="tags__input" type="checkbox" id="style-elegant" name="style" value="elegant">
                    <label class="tags__label" for="style-elegant">Elegant</label>
                    <input class="tags__input" type="checkbox" id="style-boho" name="style" value="boho">
                    <label class="tags__label" for="style-boho">Boheme</label>
                    <input class="tags__input" type="checkbox" id="style-minimal" name="style" value="minimal">
                    <label class="tags__label" for="style-minimal">Minimalistisk</label>
                    <input class="tags__input" type="checkbox" id="style-colorful" name="style" value="colorful">
                    <label class="tags__label" for="style-colorful">Farverig</label>
                    <input class="tags__input" type="checkbox" id="style-vintage" name="style" value="vintage">
                    <label class="tags__label" for="style-vintage">Vintage</label>
                </div>
            </fieldset>
            <button class="button button--next js-next" type="submit" disabled>Næste</button>
        </form>
    </main>
<script src="js/demo.js" defer></script>
</body>
</html>
